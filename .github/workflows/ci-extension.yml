name: Validar web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Comprobar regresiones de autenticación
        run: node scripts/verify-microsoft-auth.cjs

      - name: Comprobar copias de configuración
        run: node scripts/verify-configuration.cjs

      - name: Comprobar agenda del calendario
        run: node scripts/verify-calendar.cjs

      - name: Compilar la web
        run: npm run build

      - name: Validar archivos esenciales
        run: |
          test -f dist/index.html
          test -d dist/assets
