name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Comprobar regresiones de autenticación
        run: node scripts/verify-microsoft-auth.cjs

      - name: Comprobar copias de configuración
        run: node scripts/verify-configuration.cjs

      - name: Compilar para GitHub Pages
        run: npm run build:pages
        env:
          # El Client ID es identificador público de una SPA; no es un secreto.
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT: ${{ vars.MICROSOFT_TENANT || 'common' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
